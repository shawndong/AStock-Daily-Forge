[project]
name = "hunter-stock-data-pipeline"
version = "1.0.0"
description = "A-share post-close data pipeline for LLM-ready market and stock analysis packages"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
